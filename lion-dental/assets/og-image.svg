<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A2744"/>
      <stop offset="1" stop-color="#111B33"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="42%" r="55%">
      <stop offset="0" stop-color="#C9A96E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C9A96E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8D5A3"/>
      <stop offset="0.55" stop-color="#C9A96E"/>
      <stop offset="1" stop-color="#A8874E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#C9A96E" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Eyebrow -->
  <g transform="translate(90,150)">
    <rect x="0" y="-5" width="40" height="2" fill="#C9A96E"/>
    <text x="56" y="0" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="6" fill="#E8D5A3" font-weight="600">DİŞ PROTEZ LABORATUVARI</text>
  </g>

  <!-- Title -->
  <text x="88" y="270" font-family="'Cormorant Garamond', Georgia, serif" font-size="92" fill="#FFFFFF" font-weight="500">Sanatla şekillenen</text>
  <text x="88" y="370" font-family="'Cormorant Garamond', Georgia, serif" font-size="92" fill="#C9A96E" font-style="italic" font-weight="500">gülen yüzler.</text>

  <!-- Sub -->
  <text x="90" y="445" font-family="Inter, Arial, sans-serif" font-size="26" fill="#FFFFFF" fill-opacity="0.8">Zirkonyum kron · Lamine veneer · CAD/CAM · İmplant üstü protez</text>

  <!-- Brand lockup -->
  <g transform="translate(90,520)">
    <path d="M0 56 L0 30 L9 39 L23 9 L32 30 L41 9 L55 39 L64 30 L64 56 Z" stroke="#C9A96E" stroke-width="2.4" fill="rgba(201,169,110,0.14)" stroke-linejoin="round"/>
    <circle cx="23" cy="9" r="4" fill="#C9A96E"/>
    <circle cx="41" cy="9" r="4" fill="#E8D5A3"/>
    <text x="86" y="32" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#FFFFFF">LION DENTAL</text>
    <text x="88" y="54" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="8" fill="#C9A96E">ART STUDIO</text>
  </g>

  <!-- Gem motif -->
  <g transform="translate(960,300)">
    <circle r="150" fill="none" stroke="#C9A96E" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 8"/>
    <path d="M0,-95 L95,-30 L66,95 L-66,95 L-95,-30 Z" fill="url(#gem)"/>
  </g>
